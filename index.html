<!doctype html>
<html lang="ko">
<head>

<title>Nostos Hex World</title>
<style>
  :root{--ink:#54474E}
  html,body{margin:0;height:100%;background:#F6F5F7;overflow:hidden;font-family:-apple-system,"Pretendard",sans-serif}
  canvas{display:block;touch-action:none}
  #title{position:fixed;top:18px;left:0;right:0;text-align:center;color:var(--ink);font-size:13px;opacity:.8}
  #ui{position:fixed;left:0;right:0;bottom:20px;display:flex;flex-direction:column;gap:10px;align-items:center;padding:0 12px}
  .row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:720px}
  body.render #ui,body.render #title{display:none}
  button{border:0;border-radius:999px;padding:8px 14px;font-size:13px;color:var(--ink);background:rgba(255,255,255,.7);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.9),0 1px 8px rgba(80,60,80,.07);cursor:pointer;font-family:inherit}
  button:active{transform:scale(.96)}
  button.city.on{background:var(--ink);color:#fff}
  .chips button{background:rgba(255,255,255,.85)}
  @media (max-width:980px){.envbar{top:42px!important;left:14px;justify-content:center!important}.capt{top:84px!important}}
  .lab{font-size:11px;color:#9A8F95;width:100%;text-align:center}
</style>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {MarchingCubes} from 'three/addons/objects/MarchingCubes.js';

const qs=new URLSearchParams(location.search);
if(qs.get('render'))document.body.classList.add('render');
if(qs.get('alpha')){document.documentElement.style.background=document.body.style.background='transparent';}

/* ---------- renderer ---------- */
const BL=qs.get('scene')==='hand'||qs.get('look')==='blender';
const VIRTUAL=!!qs.get('virtual'),INSTANT=!!qs.get('instant'),ALPHA=!!qs.get('alpha');
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true,alpha:true});
renderer.setClearColor(0x000000,0);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=BL?THREE.VSMShadowMap:THREE.PCFSoftShadowMap;
renderer.toneMapping=BL?THREE.ACESFilmicToneMapping:THREE.NoToneMapping;renderer.toneMappingExposure=BL?(+qs.get('exp')||0.96):1;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();if(!ALPHA)scene.background=new THREE.Color(qs.get('bg')||(BL?'#FFF5ED':'#F6F5F7'));
const ground=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.ShadowMaterial({color:BL?'#423D39':'#7A6A8A',opacity:BL?.27:.16}));ground.rotation.x=-Math.PI/2;ground.position.y=-.03;ground.receiveShadow=true;scene.add(ground);
const cam=new THREE.OrthographicCamera(-1,1,1,-1,-100,100);
let ENVTEX=null;if(BL){const pm=new THREE.PMREMGenerator(renderer);ENVTEX=scene.environment=pm.fromScene(new RoomEnvironment(),0.04).texture;}
const hemi=new THREE.HemisphereLight(BL?'#EAF1FF':'#FFFFFF',BL?'#E7C9B0':'#FFE6EC',BL?(+qs.get('hemi')||0.55):1.3);scene.add(hemi);
const sun=new THREE.DirectionalLight(BL?'#FFD9A8':'#FFF1E0',BL?(+qs.get('sun')||2.7):1.25);sun.position.set(BL?-6:3.5,BL?9:11,BL?7:7.5);sun.castShadow=true;
sun.shadow.mapSize.set(BL?4096:2048,BL?4096:2048);sun.shadow.radius=BL?7:7;sun.shadow.blurSamples=16;sun.shadow.bias=BL?-0.0004:-0.0004;sun.shadow.normalBias=BL?0.03:0;
let fill=null,rim=null;if(BL){fill=new THREE.DirectionalLight('#C9DDE8',.95);fill.position.set(8,4,3);scene.add(fill);rim=new THREE.DirectionalLight('#E3ECFF',.25);rim.position.set(2,6,-8);scene.add(rim);}
Object.assign(sun.shadow.camera,{left:-12,right:12,top:12,bottom:-12,near:1,far:45});scene.add(sun);

/* ---------- helpers ---------- */
const MM={};const mat=(c,r=.85)=>MM[c+r]||(MM[c+r]=new THREE.MeshStandardMaterial({color:c,roughness:BL?Math.max(.42,r-.28):r,envMapIntensity:BL?(+qs.get('env')||.35):1}));
function mesh(g,c,x=0,y=0,z=0,r){const m=new THREE.Mesh(g,mat(c,r));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;return m;}
const rbox=(w,h,d,rad=.05)=>new RoundedBoxGeometry(w,h,d,3,Math.min(rad,w/2.2,h/2.2,d/2.2));
const sph=(r)=>new THREE.SphereGeometry(r,18,14);
const R=1,SP=1.045;
const hexPos=(q,r)=>({x:R*SP*Math.sqrt(3)*(q+r/2),z:R*SP*1.5*r});
function hexShape(s){const sh=new THREE.Shape();for(let i=0;i<6;i++){const a=Math.PI/6+i*Math.PI/3;const x=Math.cos(a)*R*s,y=Math.sin(a)*R*s;i?sh.lineTo(x,y):sh.moveTo(x,y);}sh.closePath();return sh;}
function hexTile(top,side,h=.42,glossy=false){
  const g=new THREE.Group();
  const bg=new THREE.ExtrudeGeometry(hexShape(.97),{depth:h,bevelEnabled:true,bevelThickness:.08,bevelSize:.08,bevelSegments:4,curveSegments:1});bg.rotateX(-Math.PI/2);
  g.add(mesh(bg,side,0,0,0,.9));
  const tg=new THREE.ExtrudeGeometry(hexShape(.87),{depth:.04,bevelEnabled:true,bevelThickness:.05,bevelSize:.05,bevelSegments:4,curveSegments:1});tg.rotateX(-Math.PI/2);
  g.add(mesh(tg,top,0,h+.04,0,glossy?.3:.95));
  g.userData.top=h+.14;return g;
}
const stripe=(g,n,w,y,z,tilt,c1,c2,len=.3)=>{for(let i=0;i<n;i++){const m=mesh(rbox(w/n,.05,len,.015),i%2?c2:c1,-w/2+(i+.5)*w/n,y,z);m.rotation.x=tilt;g.add(m);}};
function win(g,x,y,z,s=1,c='#FFF1CC'){g.add(mesh(rbox(.21*s,.25*s,.02,.03),'#FFF8EE',x,y,z));g.add(mesh(rbox(.15*s,.19*s,.04,.02),c,x,y,z));}
function gable(w,d,h,c){const sh=new THREE.Shape();sh.moveTo(-w/2-.05,0);sh.lineTo(w/2+.05,0);sh.lineTo(0,h);sh.closePath();
  const geo=new THREE.ExtrudeGeometry(sh,{depth:d+.1,bevelEnabled:true,bevelSize:.025,bevelThickness:.025,bevelSegments:2});geo.translate(0,0,-(d+.1)/2);return mesh(geo,c);}
function tree(s=1,c='#7FCB78'){const g=new THREE.Group();g.add(mesh(new THREE.CylinderGeometry(.05*s,.07*s,.28*s,8),'#C09A82',0,.14*s,0));
  g.add(mesh(sph(.27*s),c,0,.46*s,0));g.add(mesh(sph(.18*s),c,.1*s,.68*s,.03*s));return g;}

/* ---------- palette (Nostos UI: 파스텔 클레이 + 핑크/피치 포인트) ---------- */
const W={peach:'#FFB899',butter:'#FFDD80',mint:'#9FE3C2',lilac:'#C4B0F5',pink:'#FFAEC6',sky:'#9ED0F8',cream:'#FFF3E4'};
const PINK='#FF8FB1',PEACH='#FFA674',INK='#6B5A62';
const CITY={
  london:{label:'London',roof:'#BCAEE8',home:'brick',veh:'bus',land:'bigben',water:'#7CC6F5',grass:'#C4E8A4'},
  seoul:{label:'Seoul',roof:'#8FA9C8',home:'hanok',veh:'bus',land:'ntower',water:'#7CC6F5',grass:'#C4E8A4'},
  newyork:{label:'New York',roof:'#B3AEE2',home:'brown',veh:'cab',land:'empire',water:'#78BCF2',grass:'#C4E8A4'},
  paris:{label:'Paris',roof:'#9DBCEB',home:'apt',veh:'bike',land:'eiffel',water:'#84CCF6',grass:'#C4E8A4'},
};
const SIDE='#FBE9DA';
const GROUND={bagel:'#FFE59A',bike:'#A8EBCB',cat:'#FFC9B0',cafe:'#D9C8FA',icecream:'#A9DAFB',flower:'#FFC2D9',book:'#C6CFFB',park:'#B2E58A',tram:'#E3F29A',home:'#CBEAB0',landmark:'#F6DDB8'};
const tint=(c,k=.55)=>'#'+new THREE.Color(c).lerp(new THREE.Color('#FFF1E4'),k).getHexString();

/* ---------- memory catalogue ---------- */
const MEM={
  bagel:{label:'베이글 먹은 기억',h:2,build:(C)=>{const g=new THREE.Group();
    g.add(mesh(rbox(.95,.55,.75),W.butter,0,.275,0));g.add(mesh(rbox(1.0,.08,.8),W.cream,0,.58,0));
    stripe(g,6,.95,.5,.5,.5,PINK,'#FFFFFF');
    g.add(mesh(rbox(.2,.32,.04),W.cream,.27,.2,.38));win(g,-.2,.28,.38,1.4);
    const rf=gable(.95,.75,.22,C.roof);rf.position.y=.62;g.add(rf);g.add(mesh(rbox(.1,.26,.1,.02),'#F4B49C',.34,.78,-.18));g.add(mesh(rbox(.4,.3,.03,.02),'#6B5A62',-.62,.2,.5)).rotation.y=0;
    const b=mesh(new THREE.TorusGeometry(.26,.12,14,28),'#F2B05A',0,1.12,.02,.7);g.add(b);
    for(let i=0;i<9;i++){const a=i/9*Math.PI*2+.3;const s=mesh(sph(.025),'#FFF6E0',Math.cos(a)*.26,1.12+Math.sin(a)*.26,.02+.115);s.scale.set(1.4,1,.7);g.add(s);}
    return g;}},
  bike:{label:'자전거 탄 기억',h:0,build:()=>{const g=new THREE.Group();
    for(const x of[-.22,.22])g.add(mesh(new THREE.TorusGeometry(.14,.028,10,22),INK,x,.17,0));
    for(const x of[-.22,.22])g.add(mesh(sph(.03),'#F7E8D8',x,.17,0));
    const bar=(x1,y1,x2,y2)=>{const L=Math.hypot(x2-x1,y2-y1);const m=mesh(rbox(L,.032,.032,.01),PINK,(x1+x2)/2,(y1+y2)/2,0);m.rotation.z=Math.atan2(y2-y1,x2-x1);g.add(m);};
    bar(-.22,.17,-.02,.17);bar(-.02,.17,-.1,.34);bar(-.22,.17,-.1,.34);bar(-.1,.34,.17,.34);bar(.17,.34,.22,.17);bar(-.02,.17,.17,.34);
    g.add(mesh(rbox(.14,.035,.07,.015),INK,-.12,.37,0));g.add(mesh(rbox(.04,.12,.04,.01),INK,.17,.4,0));
    g.add(mesh(rbox(.14,.1,.16,.03),PEACH,.33,.3,0));
    g.add(mesh(rbox(.07,.03,.05,.01),'#F7E8D8',.36,.38,0));
    g.scale.setScalar(1.6);g.rotation.y=.4;return g;}},
  cat:{label:'고양이 본 기억',h:0,build:()=>{const g=new THREE.Group();const fur='#FFAE63',cr='#FFF1E2';
    const body=mesh(sph(.2),fur,0,.2,0);body.scale.set(1,.9,1.15);g.add(body);
    g.add(mesh(sph(.16),fur,0,.46,.1));
    for(const s of[-1,1]){const e=mesh(new THREE.ConeGeometry(.055,.11,4),fur,s*.09,.62,.08);e.rotation.z=-s*.2;g.add(e);
      g.add(mesh(sph(.018),'#4A3F45',s*.06,.48,.25));g.add(mesh(sph(.045),cr,s*.075,.07,.2));}
    g.add(mesh(sph(.02),'#F29CB0',0,.45,.26));g.add(mesh(sph(.09),cr,0,.4,.2));
    const t=mesh(new THREE.TorusGeometry(.13,.035,8,16,Math.PI*1.3),fur,.2,.2,-.08);t.rotation.set(Math.PI/2,0,.3);g.add(t);
    g.add(mesh(sph(.075),PINK,-.38,.075,.25));
    g.scale.setScalar(1.35);g.rotation.y=.2;return g;}},
  cafe:{label:'카페 간 기억',h:1.5,build:(C)=>{const g=new THREE.Group();
    g.add(mesh(new THREE.CylinderGeometry(.42,.46,.12,24),W.cream,0,.06,0));
    g.add(mesh(new THREE.CylinderGeometry(.3,.3,.5,24),W.mint,0,.37,0));
    for(let i=0;i<4;i++){const a=i*Math.PI/2+Math.PI/4;const w=mesh(rbox(.13,.17,.03,.02),'#FFF1CC',Math.cos(a)*.3,.4,Math.sin(a)*.3);w.rotation.y=-a+Math.PI/2;g.add(w);}
    const roof=mesh(new THREE.ConeGeometry(.5,.34,24),PINK,0,.82,0);g.add(roof);g.add(mesh(sph(.06),'#FFF3E4',0,1.03,0));
    const cup=mesh(new THREE.CylinderGeometry(.11,.08,.14,14),'#FFFFFF',.38,.2,.38);g.add(cup);g.add(mesh(new THREE.CylinderGeometry(.095,.095,.02,14),'#8A5A44',.38,.27,.38));
    g.add(mesh(rbox(.18,.22,.03,.02),'#8F7A86',.0,.25,.31));
    return g;}},
  icecream:{label:'아이스크림 먹은 기억',h:2,build:()=>{const g=new THREE.Group();
    g.add(mesh(rbox(.6,.45,.5),W.sky,0,.225,0));stripe(g,4,.6,.4,.3,.5,'#FFFFFF',PINK,.22);
    g.add(mesh(rbox(.4,.14,.03),W.cream,0,.2,.26));
    const cone=mesh(new THREE.ConeGeometry(.16,.4,16),'#EBC186',0,.78,0);cone.rotation.x=Math.PI;g.add(cone);
    g.add(mesh(sph(.2),PINK,0,1.08,0));g.add(mesh(sph(.16),W.mint,0,1.3,0));g.add(mesh(sph(.04),'#EF7B8C',0,1.47,0));
    return g;}},
  flower:{label:'꽃시장 간 기억',h:1,build:()=>{const g=new THREE.Group();
    g.add(mesh(rbox(.95,.28,.4,.04),'#E5CBA8',0,.14,.05));
    for(const x of[-.44,.44])g.add(mesh(new THREE.CylinderGeometry(.018,.018,.75,6),'#fff',x,.38,-.12));
    stripe(g,6,.95,.74,-.02,.35,PEACH,'#FFFFFF',.42);
    const cols=['#F8A9C0','#FBE08A','#CDBEF0','#FFFFFF','#F8A9C0','#F9B48E','#CDBEF0'];
    cols.forEach((c,i)=>{g.add(mesh(sph(.08),c,-.36+i*.12,.34+(i%2)*.04,.05+((i*7)%3-1)*.07));});
    g.add(mesh(rbox(.22,.18,.2,.03),'#E5CBA8',.3,.09,.4));g.add(mesh(sph(.09),'#F8A9C0',.3,.24,.4));g.add(mesh(sph(.08),'#FBE08A',.25,.26,.42));
    return g;}},
  book:{label:'서점 간 기억',h:1.2,build:()=>{const g=new THREE.Group();
    const bk=[[.95,.22,.7,'#FF8FB1',0],[.8,.2,.6,'#FFDD80',.12],[.9,.22,.65,'#9FE3C2',-.1],[.7,.2,.55,'#C4B0F5',.15],[.8,.2,.6,'#9ED0F8',-.06]];
    let y=0;bk.forEach(([w,h,d,c,r])=>{const b=new THREE.Group();b.add(mesh(rbox(w,h,d,.05),c,0,0,0));b.add(mesh(rbox(w-.06,h-.06,d-.04,.03),'#FFF6E8',.03,0,.02));b.add(mesh(rbox(w+.01,h+.01,.12,.04),c,0,0,-d/2+.06));b.position.y=y+h/2;b.rotation.y=r;g.add(b);y+=h;});
    g.add(mesh(rbox(.06,.3,.02,.01),'#FF8FB1',.1,y+.08,.1));
    return g;}},
  park:{label:'산책한 기억',h:1,build:()=>{const g=new THREE.Group();
    const p=mesh(new THREE.CylinderGeometry(.34,.34,.05,24),'#7CC6F5',-.2,.03,.2,.3);g.add(p);
    const t=tree(1.2);t.position.set(.3,0,-.25);g.add(t);
    const t2=tree(.8,'#97D88A');t2.position.set(-.35,0,-.35);g.add(t2);
    g.add(mesh(rbox(.4,.05,.15,.015),'#D9AE86',.3,.2,.3));g.add(mesh(rbox(.4,.18,.04,.015),'#D9AE86',.3,.3,.23));
    for(const x of[.15,.45])g.add(mesh(rbox(.04,.18,.12,.01),INK,x,.1,.3));
    return g;}},
  tram:{label:'트램 탄 기억',h:1,build:(C)=>{const g=new THREE.Group();
    const bus=C.veh==='bus',col=C.veh==='bus'?'#F2615A':C.veh==='cab'?'#FFD02E':'#FFD34D';
    for(const z of[-.2,.2])g.add(mesh(rbox(1.3,.04,.05,.01),'#D9CFC6',0,.025,z));
    g.add(mesh(rbox(.95,.46,.42,.1),col,0,.34,0));g.add(mesh(rbox(.86,.16,.44,.05),'#FFF6E8',0,.4,0));
    g.add(mesh(rbox(.95,.05,.44,.03),'#FFFFFF',0,.6,0));g.add(mesh(rbox(.3,.03,.04,.01),INK,0,.7,0));
    if(C.veh==='cab')g.add(mesh(rbox(.2,.08,.1,.03),'#FFFFFF',0,.67,0));
    for(const x of[-.3,.3])for(const z of[-.2,.2]){const w=mesh(new THREE.CylinderGeometry(.08,.08,.06,14),INK,x,.1,z);w.rotation.x=Math.PI/2;g.add(w);}
    return g;}},
  river:{label:'강가 걸은 기억',h:-1,water:true,build:()=>{const g=new THREE.Group();
    for(let i=0;i<9;i++){const t=i/8,x=(t-.5)*1.6,y=.1+Math.sin(t*Math.PI)*.38;g.add(mesh(rbox(.26,.14,.5,.03),'#F0E1D0',x,y+.1,0));}
    for(const z of[-.24,.24])for(let i=0;i<9;i+=2){const t=i/8,x=(t-.5)*1.6,y=.1+Math.sin(t*Math.PI)*.38;g.add(mesh(rbox(.05,.14,.05,.01),PINK,x,y+.26,z));}
    const b=new THREE.Group();b.add(mesh(rbox(.55,.14,.24,.06),PEACH,0,.12,0));b.add(mesh(rbox(.3,.14,.2,.04),W.cream,0,.24,0));b.position.set(0,.04,.52);g.add(b);
    return g;}},
  picnic:{label:'소풍 간 기억',h:1,build:()=>{const g=new THREE.Group();
    for(let i=0;i<4;i++)for(let j=0;j<4;j++)g.add(mesh(rbox(.24,.03,.19,.008),(i+j)%2?'#FFFFFF':'#FF9DB8',-.36+i*.24,.02,-.28+j*.19));
    const t=tree(1.3,'#8FD58A');t.position.set(-.4,0,-.4);g.add(t);
    const bk=mesh(rbox(.3,.16,.22,.04),'#E8BE8A',.12,.12,-.05);g.add(bk);const h=mesh(new THREE.TorusGeometry(.1,.015,8,16,Math.PI),'#C99A6E',.12,.2,-.05);h.rotation.y=0;g.add(h);
    g.add(mesh(sph(.06),'#F2615A',-.12,.08,.15));g.add(mesh(sph(.06),'#FFD34D',-.02,.08,.22));g.add(mesh(new THREE.CylinderGeometry(.045,.04,.07,10),'#FFFFFF',.3,.07,.12));
    return g;}},
  dog:{label:'강아지 본 기억',h:0,build:()=>{const g=new THREE.Group();const fur='#D79B63',dk='#9A6A44',cr='#FFF1E2';
    const body=mesh(sph(.2),fur,0,.25,-.02);body.scale.set(.9,.85,1.25);g.add(body);
    g.add(mesh(sph(.15),fur,0,.46,.2));g.add(mesh(sph(.085),cr,0,.42,.33));g.add(mesh(sph(.025),'#4A3F45',0,.45,.4));g.add(mesh(sph(.028),'#FF8FB1',0,.35,.37));
    for(const s of[-1,1]){const e=mesh(rbox(.06,.15,.1,.03),dk,s*.14,.5,.18);e.rotation.z=s*.3;g.add(e);g.add(mesh(sph(.018),'#4A3F45',s*.06,.5,.31));
      for(const z of[.1,-.15])g.add(mesh(new THREE.CylinderGeometry(.04,.04,.14,8),cr,s*.1,.07,z));}
    const t=mesh(new THREE.CylinderGeometry(.025,.04,.2,8),fur,0,.33,-.28);t.rotation.x=-.6;g.add(t);
    g.add(mesh(rbox(.2,.04,.04,.015),'#FFFFFF',.38,.03,.2));g.add(mesh(sph(.035),'#FFFFFF',.28,.03,.2));g.add(mesh(sph(.035),'#FFFFFF',.48,.03,.2));
    g.scale.setScalar(1.3);g.rotation.y=.3;return g;}},
  balloon:{label:'축제 간 기억',h:2,build:()=>{const g=new THREE.Group();
    g.add(mesh(rbox(.5,.3,.4,.05),'#FFE29A',0,.15,0));stripe(g,4,.5,.32,.2,0,'#FFFFFF',PINK,.12);
    [['#FF8FB1',-.15,1.05],['#FFDD80',.05,1.3],['#9FE3C2',.2,1.0],['#9ED0F8',-.05,.85],['#C4B0F5',.0,1.55],['#FFA674',-.22,1.35]].forEach(([c,x,y])=>{
      const b=mesh(sph(.17),c,x,y,0,.35);b.scale.y=1.15;g.add(b);g.add(mesh(new THREE.ConeGeometry(.03,.05,6),c,x,y-.21,0));
      const L=y-.22-.3;g.add(mesh(new THREE.CylinderGeometry(.006,.006,L,4),'#FFFFFF',x*.5,.3+L/2,0));});
    return g;}},
  ferris:{label:'놀이공원 간 기억',h:3,build:()=>{const g=new THREE.Group();
    g.add(mesh(rbox(.8,.1,.4,.04),W.cream,0,.05,0));

function handRiver(){ // S자 강: 타일 로컬 좌표(+x 오른쪽, +z 앞)
  const g=new THREE.Group();

    const sh=new THREE.Shape();sh.moveTo(L[0][0],-L[0][1]);for(let i=1;i<L.length;i++)sh.lineTo(L[i][0],-L[i][1]);for(let i=R.length-1;i>=0;i--)sh.lineTo(R[i][0],-R[i][1]);sh.closePath();return sh;};

function ribbonGeom(pts,hw,h,bev=0){hw-=bev; // pts: 로컬 [x,z], hw: 반폭, h: 두께 (아래→위 +y)

function buildExtraTile(kind){ // 로컬 원점 = 타일 중심 바닥

  const pm=new THREE.Mesh(roundedHexPrism(1,.5,.055),satinMat('#F2A4A4',true));pm.castShadow=pm.receiveShadow=true;g.add(pm);

  // 윗면 uv (잔디 알갱이)
  {const P=land.geometry.attributes.position,uv=new Float32Array(P.count*2);for(let i=0;i<P.count;i++){uv[i*2]=P.getX(i)*.9;uv[i*2+1]=P.getZ(i)*.9;}land.geometry.setAttribute('uv',new THREE.BufferAttribute(uv,2));}

    const line=(o)=>[[-d[0]*E+nrm[0]*o,-d[1]*E+nrm[1]*o],[d[0]*E+nrm[0]*o,d[1]*E+nrm[1]*o]];

}

function buildCanalTile(){const g=buildExtraTile('block');const top=.533;
  const d=[Math.cos(Math.PI/6),Math.sin(Math.PI/6)],nrm=[-d[1],d[0]],E=.84;
  const line=o=>[[-d[0]*E+nrm[0]*o,-d[1]*E+nrm[1]*o],[d[0]*E+nrm[0]*o,d[1]*E+nrm[1]*o]];
  const stone=pavMat(SEA().snow?'#F5F4F2':'#E9D8BA');

  for(const sg of[-1,1]){const m=new THREE.Mesh(ribbonGeom(line(sg*.25),.07,top-.5+.03,.012),stone);m.position.y=.5;m.castShadow=m.receiveShadow=true;g.add(m);}
  const w=new THREE.Mesh(ribbonGeom(line(0),.19,top-.5+.006,0),water);w.position.y=.5;w.receiveShadow=true;g.add(w);
  // 아치 다리
  const br=new THREE.Group();br.position.set(-.18*d[0],top,-.18*d[1]);br.rotation.y=-Math.atan2(nrm[1],nrm[0]);g.add(br);
  const arch=Pm(br,new THREE.TorusGeometry(.17,.03,10,24,Math.PI),'#F3E7CF',0,-.03,0);arch.scale.set(1,.55,1.6);

  bx(boat,.3,.04,.075,'#2F5A43',0,0,0,.02);bx(boat,.2,.045,.06,'#F27355',-.02,.04,0,.012);bx(boat,.21,.012,.065,'#FCD96B',-.02,.085,0,.004);

function springScale(o,t){
  if(t<0){o.scale.setScalar(.001);return;}
  if(t>1.8){o.scale.set(1,1,1);return;}
  const sy=Math.max(.001,1-Math.exp(-4.6*t)*Math.cos(15.5*t));
  const sxz=sy<1?Math.min(1.1,.45+.55*sy):Math.max(.82,1-(sy-1)*.7);
  o.scale.set(sxz,sy,sxz);
}
function update(now){
  const dt=prev===null?1/60:Math.min((now-prev)/1000,.1);prev=now;const k=1-Math.exp(-dt*5.5);
  for(const it of items){if(it.obj.userData.tick)it.obj.userData.tick(now);}
  for(const a of anims)springScale(a.o,(now-a.s)/1000);
  for(const it of pool()){if(it.hop>=0&&!it.noHop){const t=(now-it.hop)/1000;it.obj.position.y=it.baseY+(t<1.6?.2*Math.exp(-3.2*t)*Math.abs(Math.sin(t*8.5)):0);}}
  let tx=0,tz=0,tv=8.5,ty=.55;
  if(items.length){let sx=0,sz=0;items.forEach(i=>{sx+=i.pos.x;sz+=i.pos.z;});sx/=items.length;sz/=items.length;
    let dm=0;items.forEach(i=>{dm=Math.max(dm,Math.hypot(i.pos.x-sx,i.pos.z-sz));});
    const ar=innerWidth/innerHeight;tv=Math.max(2*dm*.95+4.6,(2*dm+3)/ar);if(ar>1.3)tv=Math.max(tv,8.2);tv*=FIT;tx=sx;tz=sz;if(qs.get('scene')==='showcase')ty=1.5;
    if(focus){tx=focus.pos.x;tz=focus.pos.z;tv=3.0;ty=.7;}}
  if(qs.get('scene')==='hand'){tx=VIEW.cx??(qs.get('cx')!==null?+qs.get('cx'):HAND_C.x);tz=VIEW.cz??(qs.get('cz')!==null?+qs.get('cz'):HAND_C.z);tv=VIEW.vh??(+qs.get('vh')||(ENV.city!=='base'?8.6:7.0));ty=VIEW.ty??.9;
    if(focus){tx=focus.pos.x;tz=focus.pos.z;tv=(focus.small?1.8:2.8)*(VIEW.fz||1);ty=focus.baseY+(focus.small?.1:.35);}}
  if(snap){cx=tx;cz=tz;vh=tv;snap=false;}else{cx+=(tx-cx)*k;cz+=(tz-cz)*k;vh+=(tv-vh)*k;}
  const ar=innerWidth/innerHeight;cam.left=-vh*ar/2;cam.right=vh*ar/2;cam.top=vh/2;cam.bottom=-vh/2;cam.updateProjectionMatrix();
  yaw+=(tYaw-yaw)*.1;const dist=16,el=Math.atan(1/Math.SQRT2);
  cam.position.set(cx+Math.cos(yaw)*dist*Math.cos(el),dist*Math.sin(el),cz+Math.sin(yaw)*dist*Math.cos(el));
  cam.lookAt(cx,ty,cz);
  renderer.render(scene,cam);
}

// 색 변주: 벽·지붕(채도 높은 비-초록)은 색상을 돌리고, 초록(잎)은 구역별로 톤을 바꿈
function tintGroup(g,dh,wallShift,greenDh,greenDl){
  g.traverse(o=>{if(!o.isMesh||!o.material||Array.isArray(o.material))return;const m=o.material;if(!m.color||m.transparent||(m.emissiveIntensity||0)>.35)return;

    const isGreen=hsl.h>.17&&hsl.h<.46;
    const nm=m.clone();
    if(isGreen){nm.color.offsetHSL(greenDh,.02,greenDl);if(nm.emissive&&nm.emissive.getHex())nm.emissive.offsetHSL(greenDh,.02,greenDl);}
    else{nm.color.offsetHSL(wallShift,.05,dh);if(nm.emissive&&nm.emissive.getHex())nm.emissive.offsetHSL(wallShift,.05,dh);}
    o.material=nm;});}

    {name:'들꽃 언덕', x:175, y:130, pool:['meadow','meadow','n2','meadow','path','forest'],green:[-.03,.05]},
    {name:'베이글 골목',x:165, y:-75, pool:['b5','n3','b0','n3','road','n0','b3'],green:[0,0]},
    {name:'운하 동네', x:-150,y:-120,pool:['pond','n0','pond','path','n2','b4'],green:[.01,0]},
    {name:'학교 동네', x:15,  y:-165,pool:['n4','b1','n2','park','n1','b2'],green:[0,.02]},
    {name:'시내',      x:-10, y:105, pool:['n1','n0','b2','n1','b4','n0','b3'],green:[0,0]}];

    {const dx=x+45,dy=y,rr=Math.hypot(dx,dy),th=Math.atan2(dy,dx);
     const lim=255+34*Math.sin(th*3+.7)+26*Math.sin(th*5+2.1)+18*Math.sin(th*8+4.0)+14*Math.cos(th*2+1.3);
     if(rr>lim)continue;}
